<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animación Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .canvas-container {
      border: 3px solid #ff0000;
      padding: 10px;
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
    }

    canvas {
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="canvas-container">
    <canvas id="mainCanvas" width="800" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    const img = new Image();
    img.src = 'cerdo-01.png';

    let angle = 0;

    function animate() {
      // Limpia el canvas con fondo blanco
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      angle += 0.03;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Modificación de Posición (Eje X con Coseno, Eje Y con Seno)
      const posX = centerX + Math.cos(angle) * 180;
      const posY = centerY + Math.sin(angle * 1.3) * 100;

      // Modificación de Escala (Seno)
      const scale = 0.6 + Math.sin(angle * 1.5) * 0.25;

      const imgWidth = 250;
      const imgHeight = 250;

      ctx.save();
      ctx.translate(posX, posY);
      ctx.scale(scale, scale);

      if (img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -imgWidth / 2, -imgHeight / 2, imgWidth, imgHeight);
      }

      ctx.restore();

      requestAnimationFrame(animate);
    }

    img.onload = () => {
      animate();
    };

    if (img.complete) {
      animate();
    }
  </script>
</body>
</html>
