<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    const img = new Image();
    img.src = 'cerdo-01.png';

    let angle = 0;

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      angle += 0.03;

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Modificación de Posición usando Coseno y Seno
      const posX = centerX + Math.cos(angle) * 180;
      const posY = centerY + Math.sin(angle * 1.3) * 100;

      // Modificación de Escala usando Seno
      const scale = 0.5 + Math.sin(angle * 1.5) * 0.2;

      const imgWidth = 250;
      const imgHeight = 250;

      ctx.save();
      ctx.translate(posX, posY);
      ctx.scale(scale, scale);

      if (img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -imgWidth / 2, -imgHeight / 2, imgWidth, imgHeight);
      }

      ctx.restore();

      requestAnimationFrame(animate);
    }

    // Inicia animación de inmediato y asegura la carga de la imagen
    img.onload = () => {
      // Imagen cargada correctamente
    };

    animate();
  </script>
